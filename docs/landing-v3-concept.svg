  <rect x="1292" y="21" width="92" height="44" rx="8" fill="#181a16"/><text x="1306" y="48" fill="#f3e5c0" font-size="12" font-weight="700" font-family="Arial">View demo</text>
  <text x="56" y="151" fill="#8f7449" font-size="12" font-family="Arial" letter-spacing="3">RESEARCH THE CHANGE. VERIFY THE CAUSE.</text>
  <text x="56" y="257" fill="#191b18" font-size="72" font-weight="700" font-family="Arial">Ask why it changed.</text>
  <text x="56" y="334" fill="#b39661" font-size="72" font-weight="700" font-family="Arial">Follow the evidence.</text>
  <text x="56" y="389" fill="#4c514a" font-size="19" font-family="Arial">Investigate changes in SEC filings through retrieved MD&amp;A passages.</text>
  <text x="56" y="418" fill="#4c514a" font-size="19" font-family="Arial">If the filing does not establish a cause, the answer remains open.</text>
  <rect x="56" y="458" width="272" height="58" rx="9" fill="url(#gold)"/><text x="79" y="494" fill="#181915" font-size="16" font-weight="700" font-family="Arial">Explore the demo status →</text>
