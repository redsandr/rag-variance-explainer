  <text x="85" y="611" fill="#c9b783" font-size="11" font-family="Arial" letter-spacing="2">THE EVIDENCE TRAIL</text>
  <text x="86" y="652" fill="#f5f2e9" font-size="23" font-weight="700" font-family="Arial">One question. Every step visible.</text>
